[package]
name = "fx-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Language server for CASIO fx-50FH II PRGM source"

[lib]
name = "fx_lsp"
path = "src/lib.rs"

[[bin]]
name = "fx-lsp"
path = "src/main.rs"

[dependencies]
casio-fx50fh2 = { path = "../.." }
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
