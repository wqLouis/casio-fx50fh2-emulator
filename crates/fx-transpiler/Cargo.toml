[package]
name = "fx-transpiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Transpile a small C-like language into CASIO fx-50FH II PRGM source"

[lib]
name = "fx_transpiler"
path = "src/lib.rs"

[features]
default = ["testing"]
# Run transpiled programs; needs the interpreter.
execute = ["dep:casio-fx50fh2"]
# JSON-driven test suites (`fx50 test`); needs the interpreter.
testing = ["execute"]

[dependencies]
casio-fx50fh2 = { path = "../..", optional = true }
