<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before the first paint, so the page never flashes the wrong theme.
			// Same key and same rule as `$lib/theme.svelte`, which takes over once
			// the app has mounted and keeps the class in step from then on.
			(function () {
				try {
					var choice = localStorage.getItem('fx50.theme');
					var dark =
						choice === 'dark' ||
						(choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					var root = document.documentElement;
					root.classList.add(dark ? 'dark' : 'light');
					root.style.colorScheme = dark ? 'dark' : 'light';
				} catch (error) {
					// No storage, no matchMedia: fall back to the dark ramp, which is
					// what the palette does with neither class present.
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
