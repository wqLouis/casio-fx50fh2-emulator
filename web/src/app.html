<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before the first paint, so the page never flashes the wrong theme.
			// Same key and same rule as `$lib/theme.svelte`, which takes over once the
			// app has mounted. The theme class is the only switch — `layout.css` owns
			// the palettes and the `color-scheme` that goes with each one, so nothing
			// here needs to know which themes are dark.
			(function () {
				try {
					var stored = localStorage.getItem('fx50.theme');
					var dark =
						stored === 'theme-fx50-dark' ||
						((stored === null || stored === 'system') &&
							matchMedia('(prefers-color-scheme: dark)').matches);
					var fallback = dark ? 'theme-fx50-dark' : 'theme-fx50-light';
					// An unrecognised value is used as-is; the store corrects it on mount,
					// and a class that matches no theme simply leaves the default in place.
					document.documentElement.classList.add(stored || fallback);
				} catch (error) {
					document.documentElement.classList.add('theme-fx50-dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
