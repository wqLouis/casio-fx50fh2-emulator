[package]
name = "fx50"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zed extension for the CASIO fx-50FH II"

# Standalone workspace.  This extension lives inside the calculator project's
# Cargo workspace, but Zed builds it on its own for `wasm32-wasip2`.  Without
# this empty table, cargo walks up, finds the outer workspace, and fails with
# "current package believes it's in a workspace when it's not".
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/fx50.rs"

[dependencies]
zed_extension_api = "0.1.0"
